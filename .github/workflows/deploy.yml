name: Build & Deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "chore: rebuild single-file HTML"
          git push

ve patience in order to teach.",type:"Purpose (In order to)"},{tib:"ཆོས་ཉམས་ལེན་བྱེད་པ་ལ་ཡིན་ཅིག་མིན་ཅིག་སྙིང་རྗེ་ཡོད་དགོས་རེད།",eng:"One must have compassion in order to practice the Dharma.",type:"Purpose (In order to)"},{tib:"དབྱིན་ཡུལ་ལ་ལས་ཀ་བྱེད་ཡའི་ཆེད་དུ་དབྱིན་ཇི་སྦྱང་གི་ཡོད།",eng:"I am learning English in order to work in England.",type:"Purpose (In order to)"},{tib:"ཟ་ཁང་ཟིམ་ཡའི་ཆེད་དུ་མོག་མོག་བཟོ་སྟངས་སྦྱང་གི་ཡོད།",eng:"I am learning how to make momos in order to run a restaurant.",type:"Purpose (In order to)"},{tib:"སྐད་སྦྱང་ཡག་ལ་བཟོད་པ་དང་བརྩོན་འགྲུས་དོ་སྣང་བསམ་བརྟན་ཡིན་ཅིག་མིན་ཅིག་དགོས་རེད།",eng:"One must have patience, diligence, interest, and concentration to learn a language.",type:"Purpose (In order to)"},{tib:"བདེ་བ་ཡོང་ཡག་ལ་དགེ་བ་ཡིན་ཅིག་མིན་ཅིག་བསག་དགོས་རེད།",eng:"One must accumulate merit in order to have happiness.",type:"Purpose (In order to)"},{tib:"གཏན་གྱི་བདེ་བའི་ཆེད་དུ་གནས་སྐབས་ཀྱི་བདེ་བ་བློས་གཏང་དགོས་རེད།",eng:"One must sacrifice temporary happiness for permanent happiness.",type:"Purpose (In order to)"},{tib:"མ་རྗེད་ཡའི་ཆེད་དུ་འབྲི་གོ་ཡོད།",eng:"I write in order not to forget.",type:"Purpose (In order not to)"},{tib:"མ་རྗེད་ཡའི་ཆེད་དུ་འབྲི་དགོས་རེད།",eng:"One has to write in order not to forget.",type:"Purpose (In order not to)"},{tib:"ཡག་པོ་ཡོང་བ་ལ་སྔོན་ཚུད་ནས་གྲ་སྒྲིགས་བྱེད་དགོས་རེད།",eng:"One has to prepare in advance in order for things to go well.",type:"Purpose (In order not to)"},{tib:"ཁོང་ཚོ་ན་ཚ་མ་འགོས་ཡག་ལ་ཁབ་རྒྱབ་ཀྱི་ཡོད་རེད།",eng:"They are taking vaccines in order not to get infected.",type:"Purpose (In order not to)"},{tib:"ཡིན་ཅིག་མིན་ཅིག་འོས་ཤོག་བླུག་དགོས་ཡག་ཡོད་མ་རེད།",eng:"It is not mandatory to cast a vote.",type:"Purpose (In order not to)"},{tib:"གཙང་མ་བཟོས་ཁ་ལག་བཟོས་སྣོད་ཆས་བཀྲུས་བྱས་པ་ཡིན།",eng:"I did the cleaning, cooking and washing the dishes.",type:"Sequential Actions"},{tib:"ཁོང་གིས་ཁང་མིག་གཙང་མ་བཟོས་ཉིན་དགུང་ཁ་ལག་བཟོས་དུག་སློག་བཀྲུས་བྱས་ཤག།",eng:"He has cleaned the room, cooked the lunch and washed the clothes." rsay (ཟ་)"},{tib:"ཨ་རག་སྤང་ཟ།",eng:"I was told to quit drinking alcohol.",type:"Hearsay (ཟ་)"},{tib:"གནས་ཚུལ་ཡག་ཏུ་འགྲོ་གི་ཡོད་རེད་ཟ།",eng:"They say the situation is becoming better.",type:"Hearsay (ཟ་)"},{tib:"ཚེས་པ་ཅོས་ལྔ་ལ་ཤ་ཟ་རྒྱུ་ཡོད་མ་རེད་ཟ།",eng:"I was told that one should not eat meat on full moon days.",type:"Hearsay (ཟ་)"},{tib:"བོད་ལ་ལས་ཀ་བྱེད་ཡག་ལ་བོད་སྐད་སྦྱང་དགོས་རེད་ཟ།",eng:"They say one has to learn Tibetan in order to work in Tibet.",type:"Hearsay (ཟ་)"},{tib:"ཤ་ཡིན་ཅིག་མིན་ཅིག་སྤང་དགོས་ཡག་ཡོད་མ་རེད་ཟ།",eng:"I was told that it is not compulsory to quit eating meat.",type:"Hearsay (ཟ་)"},{tib:"ང་ཁོང་ཚོ་དགོན་པ་རྙིང་པ་དེ་ལ་འཁྲིད་དགོས་རེད་ཟ།",eng:"They say I have to take them to the old monastery.",type:"Hearsay (ཟ་)"},{tib:"ཁོང་ཚོ་རྒྱ་གར་ལ་ད་དུང་ཉི་མ་དྲུག་སྡད་དགོས་རེད་ཟ།",eng:"I was told that they have to stay in India for six more days.",type:"Hearsay (ཟ་)"},{tib:"ཁོང་ཚོ་གཟའ་འཇུག་ལ་སློབ་གྲྭ་ལ་འགྲོ་དགོས་མ་རེད་ཟ།",eng:"They say that they don’t have to go to school on weekends.",type:"Hearsay (ཟ་)"},{tib:"ཁོང་སློབ་ཕྲུག་ཡིན་ཤག་བྱས་པ་ཡིན།",eng:"I presumed that he was a student.",type:"Presumption"},{tib:"ཁྱེད་རང་སློབ་ཕྲུག་ཡིན་ཤག་བྱེད་ཀྱི་ཡོད།",eng:"I presume that you are a student.",type:"Presumption"},{tib:"ཁོ་སློབ་ཕྲུག་མིན་ཤག་བྱས་པ་ཡིན།",eng:"I assumed that he was not a student.",type:"Presumption"},{tib:"ཁྱེད་རང་དགོན་པ་ལ་ཡོད་ཤག་བྱས་པ་ཡིན།",eng:"I assumed that you were at the monastery.",type:"Presumption"},{tib:"ཁྱེད་རང་དགོན་པ་ལ་ཡོད་ཤག་བྱེད་ཀྱི་ཡོད།",eng:"I assume that you are at the monastery.",type:"Presumption"},{tib:"ཁོང་ཚོ་ལས་ཁུངས་ལ་མེད་ཤག་བྱས་པ་ཡིན།",eng:"I presumed that they were not at the office.",type:"Presumption"},{tib:"ཁོང་ཚོ་སློབ་ཕྲུག་ཡིན་ཤག་བྱས་ནས་ཡོང་བཅུག་པ་ཡིན།",eng:"I let them come assuming that they were students.",type:"Presumption"},{tib:"ཁོང་ཚོ་ལས་ཀ་ཧུར་པོ་ཡོད་ཤག་བྱས་ནས་ལས་ཀ་དེ་སྤྲད་པ་ཡིན།",eng:"I gave them the job assuming they were hard working.",type:"Presumption"},{tib:"ཁྱེད་རང་ཕེབས་ཡག་ཡིན་ཤག་བྱས་ནས་མོ་ཊྲ་གཅིག་གླས་པ་ཡིན།",eng:"I hired a taxi assuming you would come.",type:"Presumption"},{tib:"ང་ཡོད་ཤག་མ་བྱེད་ཨ།",eng:"Don’t take me for granted to be there.",type:"Presumption"},{tib:"ཁོང་གིས་ཁྱེད་རང་རྒྱ་གར་ལ་ཕྱིན་པ་ཡིན་ཤག་བྱས་པ་རེད།",eng:"He assumed that you went to India.",type:"Presumption"},{tib:"ཁོང་ཚོས་ཁྱེད་རང་རྒྱ་གར་ལ་ཡོད་ཤག་བྱེད་ཀྱི་ཡོད་རེད།",eng:"They presume that you are in India.",type:"Presumption"},{tib:"ཁང་པ་འདི་ངས་བཟོས་པ་རེད།",eng:"As a matter of fact, I built this house.",type:"Refutation/Assertion"},{tib:"ང་ཚོས་ཁོང་ཚོ་ལ་མོག་མོག་ཟོ་སྟངས་བསླབས་པ་རེད།",eng:"In fact, we taught them how to make momo.",type:"Refutation/Assertion"},{tib:"ཁྱེད་རང་བོད་སྐད་སྦྱང་ག་བཏང་བ་རེད།",eng:"In reality, you were sent to the school to learn Tibetan.",type:"Refutation/Assertion"},{tib:"ཁོང་ཚོས་མི་རྒན་ཁོག་དེ་ལ་རོགས་པ་བྱེད་ཡག་ཐབས་ཤེས་བྱས་པ་རེད།",eng:"As a matter of fact, they tried to help the old man.",type:"Refutation/Assertion"},{tib:"ཁང་པ་འདི་ངས་བཟོས་པ་མ་རེད།",eng:"In fact I didn’t make this house.",type:"Refutation/Assertion"},{tib:"ཁོང་ཚོ་བོད་སྐད་སྦྱང་ག་ཡོང་བ་མ་རེད།",eng:"In reality they didn’t come to learn Tibetan.",type:"Refutation/Assertion"},{tib:"ཁོས་ཕ་མའི་ཁ་ལ་ཉན་པ་མ་རེད།",eng:"In fact, he didn’t listen to his parents.",type:"Refutation/Assertion"},{tib:"གནས་ཚུལ་ཡག་ཏུ་ཕྱིན་པ་མ་རེད།",eng:"As a matter of fact, the situation didn’t get any better.",type:"Refutation/Assertion"},{tib:"ཁོང་ཚོས་ཁང་པ་གསར་པ་ཆེན་པོ་དེ་ཉོས་པ་མ་རེད།",eng:"In reality they didn’t buy the big new house.",type:"Refutation/Assertion"}],nk=[{tib:"སྡུག་བསྔལ་གྱི་རྒྱུ་ཉོན་མོངས་རེད་ཨས།",eng:"Do you mean to say that negative emotions are the cause of suffering?",type:"You mean? (ཨས་)"},{tib:"བདེ་བའི་རྒྱུ་ཉོན་མོངས་མ་རེད་ཨས།",eng:"Do you mean to say that negative emotions are not the cause of happiness?",type:"You mean? (ཨས་)"},{tib:"བརྩོན་འགྲུས་ལས་བཟོད་པ་གལ་ཆེ་བ་ཡོད་རེད་ཨས།",eng:"Do you mean to say patience is more important than diligence?",type:"You mean? (ཨས་)"},{tib:"ཀུན་སློང་གལ་ཆེ་ཤོས་རེད་ཨས།",eng:"Do you mean to say that motivation is the most important?",type:"You mean? (ཨས་)"},{tib:"རྫུན་མ་བཤད་ཨས།",eng:"Are you telling me not to tell lies?",type:"You mean? (ཨས་)"},{tib:"དུས་ཚོད་ལ་ཤོག་ཨས།",eng:"Are you telling me to come on time?",type:"You mean? (ཨས་)"},{tib:"བོད་སྐད་སྦྱང་ག་ཡོང་བ་ཡིན་ཨས།",eng:"Do you mean to say that you came to learn Tibetan?",type:"You mean? (ཨས་)"},{tib:"སང་ཉིན་ཡོང་ཡག་ཡིན་ཨས།",eng:"Do you mean to say that you are going to come tomorrow?",type:"You mean? (ཨས་)"},{tib:"སྡུག་བསྔལ་གྱི་རྒྱུ་ཉོན་མོངས་རེད་ད།",eng:"I am letting you know that negative emotions are the cause of suffering.",type:"Letting you know (ད)"},{tib:"སྨན་པ་སྨན་ཁང་ལ་ཡོད་རེད་ད།",eng:"I am letting you know that the doctor is in the hospital.",type:"Letting you know (ད)"},{tib:"རྡོ་རྗེ་གླིང་ལ་དགུན་ཁ་གྲང་སའི་ཡོད་རེད་ད།",eng:"I am letting you know that it is quite cold in winter in Darjeeling.",type:"Letting you know (ད)"},{tib:"དུས་ཚོད་འཕྲོ་བརླག་གཏང་རྒྱུ་ཡོད་མ་རེད་ད།",eng:"I am letting you know that one shouldn’t waste time.",type:"Letting you know (ད)"},{tib:"སྐད་སྦྱང་ཡག་ལ་བཟོད་པ་དང་བརྩོན་འགྲུས་དོ་སྣང་ཡིན་ཅིག་མིན་ཅིག་དགོས་རེད་པ།",eng:"One has to have patience, diligence and interest in order to learn a language, right?",type:"Confirmation tag (པ)"},{tib:"ཁོང་ཚོས་ཁྱེད་རང་ལ་དེའི་སྐོར་ལ་ལབ་མ་སོང་ང།",eng:"They didn’t tell you about it, right?",type:"Confirmation tag (ང)"},{tib:"དབྱར་ཀ་ལས་དགུན་ཁ་གྲང་ང་འདུག་ག།",eng:"Winter is colder than summer, right?",type:"Confirmation tag (ག)"},{tib:"ངས་དྲན་པ་ལ་གྲོང་གསེབ་དེ་ལ་སློབ་གྲྭ་ཡོད་མ་རེད།",eng:"As far as I remember, there is no school in that village.",type:"As far as I know"},{tib:"ངས་ཧ་གོ་ཡག་ལ་དགོན་པ་དེ་ལ་གྲྭ་པ་གསུམ་བརྒྱ་མིན་ཙམ་ཡོད་རེད།",eng:"From what I know, there are a little less than three hundred monks at the monastery.",type:"As far as I know"},{tib:"ངས་མཐོང་པ་ལ་རྡོ་རྗེ་གླིང་ལ་དགུན་ཁ་གྲང་སའི་འདུག།",eng:"As far as I have seen, it is quite cold in winter in Darjeeling.",type:"As far as I know"},{tib:"ངས་གོ་ཡག་ལ་གཞུང་གི་སློབ་གྲ་ལས་སྒེར་གྱི་སློབ་གྲྭ་ཡག་ག་ཡོད་རེད།",eng:"From what I hear, private schools are better than public schools.",type:"As far as I know"},{tib:"སོ་སོ་ལ་རག་ལས་ཀྱི་ཡོད་རེད།",eng:"It depends on oneself.",type:"Depends On/Whether"},{tib:"ཁྱེད་རང་གི་ཀུན་སློང་ལ་རག་ལས་ཀྱི་ཡོད་རེད།",eng:"It depends on your motivation.",type:"Depends On/Whether"},{tib:"རྒྱུ་རྐྱེན་མང་པོ་ལ་རག་ལས་ཀྱི་ཡོད་རེད།",eng:"It depends on many causes and conditions.",type:"Depends On/Whether"},{tib:"ཐུབ་མ་ཐུབ་རྒྱུ་རྐྱེན་མང་པོ་ལ་རག་ལས་ཀྱི་ཡོད་རེད།",eng:"Whether one will succeed or not depends on many causes and conditions.",type:"Depends On/Whether"},{tib:"ང་བལ་ཡུལ་ལ་འགྲོ་མ་འགྲོ་གནས་ཚུལ་ལ་རག་ལས་ཀྱི་ཡོད་རེད།",eng:"Whether I go to Nepal or not depends on the situation there.",type:"Depends On/Whether"},{tib:"ཐུབ་མ་ཐུབ་དོ་སྣང་ཡོད་མེད་ལ་རག་ལས་ཀྱི་ཡོད་རེད།",eng:"Whether you succeed depends on whether you have interest in it or not.",type:"Depends On/Whether"}],ak=[{tib:"གང་ཐུབ་ཐུབ་བྱས་པ་ཡིན།",eng:"I did my best.",type:"Do one's best"},{tib:"གང་ཡོང་ཅི་ཡོང་བྱེད་དགོས་རེད།",eng:"You have to do to the best of your ability.",type:"Do one's best"},{tib:"གང་ཐུབ་ཅི་ཐུབ་གནང་རོགས་གནང།",eng:"Please do your best.",type:"Do one's best"},{tib:"གང་ཐུབ་ཐུབ་བྱེད་ཡག་ཡིན།",eng:"I am going to do my best.",type:"Do one's best"},{tib:"ཁོང་ཚོས་ཁོང་ཚོ་ལ་གང་ཐུབ་ཅི་ཐུབ་རོགས་པ་གནང་ཤག།",eng:"They have done their best to help them.",type:"Do one's best"},{tib:"ཡོད་གུ་རྩལ་སྦྲུག་བྱས་པ་ཡིན།",eng:"I left no stone unturned.",type:"Leave no stone unturned"},{tib:"ཁོང་ཚོས་རྒྱལ་ཁབ་ཡར་རྒྱས་གཏང་ཡག་ལ་ཐབས་ཤེས་ཡོད་གུ་རྩལ་སྦྲུག་བྱས་ཤག",eng:"They have left no stone unturned to develop the country.",type:"Leave no stone unturned"},{tib:"བཀའ་འདྲི་གནང་རྐྱང་གནང་རོགས་གནང།",eng:"Please feel free to ask questions.",type:"Feel free to"},{tib:"བཀའ་འདྲི་ཞུ་རྐྱང་གནས་དགོས་རེད།",eng:"You should feel free to ask questions.",type:"Feel free to"},{tib:"ངའི་ཆང་འཐུང་འདོད་ཡོད་ན་འཐུང་རྐྱང་གནང་ན་འགྲིགས་ཀྱི་རེད།",eng:"You can feel free to drink my beer if you want to.",type:"Feel free to"},{tib:"ངའི་གཙོ་འཛིན་ག

ctly at 10 o’clock tomorrow."},{tib:"དེ་སོང་ཙང་ཁྱེད་རང་གི་ཆེད་དུ་ཁང་པ་ཡག་པོ་གཅིག་འཚོལ་གྱི་ཡིན།",eng:"I will look for a good house for you."},{tib:"བྱས་ཙང་རྡོ་རྗེ་གདན་ལ་དགུན་ཁ་འགྲོ་གི་ཡིན།",eng:"So I will go to Bodhgaya in winter."}],TS=[{tense:"Past (witnessed)",structure:"Verb (past) + སོང།"},{tense:"Past (not witnessed)",structure:"Verb (past) + པ་རེད།"},{tense:"Present perfect (witnessed)",structure:"Verb (past) + ཤག། / འདུག།"},{tense:"Present perfect (assumption)",structure:"Verb (past) + ཡོད་རེད།"},{tense:"Present (witnessed)",structure:"Verb (present) + གི་འདུག།"},{tense:"Present (assumption)",structure:"Verb (present) + གི་ཡོད་རེད།"},{tense:"Future",structure:"Verb (future) + གི་རེད།"}],AS=[{tib:"ཁོང་ཚོ་སྔ་པོ་ཕེབས་སོང།",eng:"They came early."},{tib:"ཁོང་ཚོ་ཁ་ཤས་ལས་ཁུངས་ལ་ཕྱི་པོ་ཕེབས་སོང།",eng:"Some of them came late to the office."},{tib:"ཁོང་ཚོ་རྒྱ་གར་ལ་ཉི་མ་བཅུ་བཞུགས་སོང།",eng:"They stayed in India for ten days."},{tib:"ཁོང་ཚོ་སྒྲོན་ཁང་ཆུང་ཆུང་གཅིག་ལ་བཞུགས་སོང།",eng:"They stayed in a small hotel."},{tib:"ཁོང་ཚོ་ཚང་མ་ལོགས་ཙམ་གནས་སྐོར་ལ་ཕེབས་སོང།",eng:"Almost all of them went on pilgrimage."},{tib:"བྱས་ཙང་ཁོང་གིས་ཁོང་ཚོ་ལ་དེའི་སྐོར་ལ་གསུངས་སོང།",eng:"So, he told them about it."}],ES=[{tib:"སངས་རྒྱས་རྒྱ་གར་ལ་ཁྲུངས་པ་རེད།",eng:"Buddha was born in India."},{tib:"དེ་ཡིད་བཞིན་ནོར་བུས་ཕྱག་བྲིས་གནང་བ་རེད།",eng:"It was written by the Dalai Lama."},{tib:"མཁྱེན་ཆེན་ཞི་བ་འཚོ་བོད་ལ་དུས་རབས་བདུན་པ་ལ་ཕེབས་པ་རེད།",eng:"Shantarakshita went to Tibet in the seventh century."},{tib:"ཁོང་བོད་ལ་གྲོངས་པ་རེད།",eng:"He passed away in Tibet."},{tib:"སྐུ་ཞབས་ཀོ་ལམ་བའ་སེ་ཨི་ཏྲི་ལི་ལ་ཁྲུངས་པ་རེད།",eng:"Columbus was born in Italy."},{tib:"སྐུ་ཞབས་ཧན་རིག་ཧེ་རར་བོད་ལ་ལོ་བདུན་བཞུགས་པ་རེད།",eng:"Heinrich Harrer stayed in Tibet for seven years."},{tib:"བོད་ཀྱི་རྒྱལ་པོ་སྲོང་བཙན་སྒམ་པོས་ཕོ་བྲང་པོ་ཊ་ལ་བཞེངས་པ་རེད།",eng:"King Songtsen Gampo built the Potala Palace."},{tib:"སྲོང་བཙན་སྒམ་པོས་ཐོན་མི་སམ་བྷོ་ཏ་རྒྱ་གར་ལ་བཏང་བ་རེད།",eng:"Songtsen Gampo sent Thonmi Sambhota to India."}],CS=[{tib:"ཁོ་སློབ ne language at a time."}],JS=[{tib:"རྒན་ལགས་ལ་ཡང་བསྐྱར་འགྲེལ་བཤད་ཀྱོན་རོགས་གནང་ཟེར་རེ་འདུན་ཞུས་པ་ཡིན།",eng:"I requested the teacher to explain it again."},{tib:"ང་ཚོས་ཁྱེད་རང་ལ་གང་ཐུབ་ཐུབ་གནང་རོགས་གནང་ཟེར་རེ་སྐུལ་ཞུ་གི་ཡོད།",eng:"We are requesting you to do your best."},{tib:"ཁོང་ཚོ་མ་ཐུབ་བར་དུ་ཐབས་ཤེས་གནང་རོགས་གནང་ཟེར་རེ་འདུན་ཞུ་གི་ཡིན།",eng:"I will request them to try until they succeed."},{tib:"ཁོང་ལ་རོགས་པ་གནང་རོགས་ཟེར་གསུངས་དགོས་རེད་པ།",eng:"You should have requested him to help you."},{tib:"ཁོང་ལ་རོགས་པ་གནང་རོགས་གནང་ཟེར་མ་གསུངས་དགོས་རེད་པ།",eng:"You shouldn’t have requested him to help."},{tib:"ཁོང་ཚོ་ལ་དབྱིན་ཇི་བསླབ་རོགས་གནང་ཟེར་རེ་འདུན་ཞུས་ནའི་ཏག་ཏག་ཡིན།",eng:"I should have requested them to teach English."},{tib:"ཁོང་ཚོ་ལ་ཟ་ཁང་ཡག་པོ་གཅིག་སྟོན་རོགས་གནང་ཟེར་རེ་འདུན་མ་ཞུས་ནའི་འགྲིགས་པ་ཡོད།",eng:"I shouldn’t have requested them to show me a good restaurant."},{tib:"མོ་ལ་དངུལ་ཕང་པོ་བྱས་ནས་བེད་སྤྱོད་བྱེད་རོགས་གནང་ཟེར་རེ་འདུན་ཞུ་ཡག་འཆར་གཞི་ཡོད།",eng:"I plan to request her to use the money sparingly."},{tib:"ང་ཚོ་མོ་ལ་དངུལ་ཕང་པོ་བྱས་ནས་བེད་སྤྱོད་བྱེད་རོགས་གནང་ཟེར་རེ་འདུན་ཞུ་འདོད་ཡོད།",eng:"We would like to request her to use the money sparingly."},{tib:"མོ་ལ་དངུལ་ཕང་པོ་བྱས་ནས་བེད་སྤྱོད་བྱེད་རོགས་གནང་ཟེར་རེ་འདུན་ཞུས་པས།",eng:"Did you request her to use the money sparingly?"},{tib:"མོ་ལ་དངུལ་ཕང་པོ་བྱས་ནས་བེད་སྤྱོད་བྱེད་རོགས་གནང་ཟེར་རེ་འདུན་ཞུ་དགོས་རེད་པ།",eng:"You should have requested her to use the money sparingly."},{tib:"མོ་ལ་དངུལ་ཕང་པོ་བྱས་ནས་བེད་སྤྱོད་བྱེད་རོགས་ཟེར་ལབ་ནའི་ཏག་ཏག་ཡིན།",eng:"I should have requested her to use the money sparingly."},{tib:"ཁོས་མོ་ལ་དངུལ་ཕང་པོ་བྱས་ནས་བེད་སྤྱོད་བྱེད་རོགས་གནང་ཟེར་རེ་འདུན་ཞུ་དགོས་ཡག་རེད།",eng:"He is expected to request her to use the money sparingly."},{tib:"ཁོང་གིས་སློབ་ཕྲུག་ཚོ་ལ་དུས་ཚོད་འཕྲོ་བརླག་མ་གཏང་རོགས་གནང་ཟེར་རེ་འདུན་ཞུས་སོང།",eng:"He requested the students not to waste time."},{tib:"ཁོང་ཚོ་ལ་དོ་སྣང་བྱས་ནས་གསན་རོགས་གནང་ཟེར་ཞུས་ག།",eng:"Should I request them to listen attentively?"},{tib:"ང་ཚོ་ཁོང་ཚོ་ལ་དོ་སྣང་བྱས  days.",type:"Hearsay (ཟ་)"},{tib:"ཁོང་ཚོ་གཟའ་འཇུག་ལ་སློབ་གྲྭ་ལ་འགྲོ་དགོས་མ་རེད་ཟ།",eng:"They say that they don’t have to go to school on weekends.",type:"Hearsay (ཟ་)"},{tib:"ཁོང་སློབ་ཕྲུག་ཡིན་ཤག་བྱས་པ་ཡིན།",eng:"I presumed that he was a student.",type:"Presumption"},{tib:"ཁྱེད་རང་སློབ་ཕྲུག་ཡིན་ཤག་བྱེད་ཀྱི་ཡོད།",eng:"I presume that you are a student.",type:"Presumption"},{tib:"ཁོ་སློབ་ཕྲུག་མིན་ཤག་བྱས་པ་ཡིན།",eng:"I assumed that he was not a student.",type:"Presumption"},{tib:"ཁྱེད་རང་དགོན་པ་ལ་ཡོད་ཤག་བྱས་པ་ཡིན།",eng:"I assumed that you were at the monastery.",type:"Presumption"},{tib:"ཁྱེད་རང་དགོན་པ་ལ་ཡོད་ཤག་བྱེད་ཀྱི་ཡོད།",eng:"I assume that you are at the monastery.",type:"Presumption"},{tib:"ཁོང་ཚོ་ལས་ཁུངས་ལ་མེད་ཤག་བྱས་པ་ཡིན།",eng:"I presumed that they were not at the office.",type:"Presumption"},{tib:"ཁོང་ཚོ་སློབ་ཕྲུག་ཡིན་ཤག་བྱས་ནས་ཡོང་བཅུག་པ་ཡིན།",eng:"I let them come assuming that they were students.",type:"Presumption"},{tib:"ཁོང་ཚོ་ལས་ཀ་ཧུར་པོ་ཡོད་ཤག་བྱས་ནས་ལས་ཀ་དེ་སྤྲད་པ་ཡིན།",eng:"I gave them the job assuming they were hard working.",type:"Presumption"},{tib:"ཁྱེད་རང་ཕེབས་ཡག་ཡིན་ཤག་བྱས་ནས་མོ་ཊྲ་གཅིག་གླས་པ་ཡིན།",eng:"I hired a taxi assuming you would come.",type:"Presumption"},{tib:"ང་ཡོད་ཤག་མ་བྱེད་ཨ།",eng:"Don’t take me for granted to be there.",type:"Presumption"},{tib:"ཁོང་གིས་ཁྱེད་རང་རྒྱ་གར་ལ་ཕྱིན་པ་ཡིན་ཤག་བྱས་པ་རེད།",eng:"He assumed that you went to India.",type:"Presumption"},{tib:"ཁོང་ཚོས་ཁྱེད་རང་རྒྱ་གར་ལ་ཡོད་ཤག་བྱེད་ཀྱི་ཡོད་རེད།",eng:"They presume that you are in India.",type:"Presumption"},{tib:"ཁང་པ་འདི་ངས་བཟོས་པ་རེད།",eng:"As a matter of fact, I built this house.",type:"Refutation/Assertion"},{tib:"ང་ཚོས་ཁོང་ཚོ་ལ་མོག་མོག་ཟོ་སྟངས་བསླབས་པ་རེད།",eng:"In fact, we taught them how to make momo.",type:"Refutation/Assertion"},{tib:"ཁྱེད་རང་བོད་སྐད་སྦྱང་ག་བཏང་བ་རེད།",eng:"In reality, you were sent to the school to learn Tibetan.",type:"Refutation/Assertion"},{tib:"ཁོང་ཚོས་མི་རྒན་ཁོག་དེ་ལ་རོགས་པ་བྱེད་ཡག་ཐབས་ཤེས་བྱས་པ་རེད།",eng:"As a matter of fact, they tried to help the old man.",type:"Refutation/Assertion"},{tib:"ཁང་པ་འདི་ངས་བཟོས་པ་མ་རེད།",eng:"In fact I didn’t make this house.",type:"Refutation/Assertion"},{tib:"ཁོང་ཚོ་བོད་སྐད་སྦྱང་ག་ཡོང་བ་མ་རེད།",eng:"In reality they didn’t come to learn Tibetan.",type:"Refutation/Assertion"},{tib:"ཁོས་ཕ་མའི་ཁ་ལ་ཉན་པ་མ་རེད།",eng:"In fact, he didn’t listen to his parents.",type:"Refutation/Assertion"},{tib:"གནས་ཚུལ་ཡག་ཏུ་ཕྱིན་པ་མ་རེད།",eng:"As a matter of fact, the situation didn’t get any better.",type:"Refutation/Assertion"},{tib:"ཁོང་ཚོས་ཁང་པ་གསར་པ་ཆེན་པོ་དེ་ཉོས་པ་མ་རེད།",eng:"In reality they didn’t buy the big new house.",type:"Refutation/Assertion"}],gT=[{tib:"སྡུག་བསྔལ་གྱི་རྒྱུ་ཉོན་མོངས་རེད་ཨས།",eng:"Do you mean to say that negative emotions are the cause of suffering?",type:"You mean? (ཨས་)"},{tib:"བདེ་བའི་རྒྱུ་ཉོན་མོངས་མ་རེད་ཨས།",eng:"Do you mean to say that negative emotions are not the cause of happiness?",type:"You mean? (ཨས་)"},{tib:"བརྩོན་འགྲུས་ལས་བཟོད་པ་གལ་ཆེ་བ་ཡོད་རེད་ཨས།",eng:"Do you mean to say patience is more important than diligence?",type:"You mean? (ཨས་)"},{tib:"ཀུན་སློང་གལ་ཆེ་ཤོས་རེད་ཨས།",eng:"Do you mean to say that motivation is the most important?",type:"You mean? (ཨས་)"},{tib:"རྫུན་མ་བཤད་ཨས།",eng:"Are you telling me not to tell lies?",type:"You mean? (ཨས་)"},{tib:"དུས་ཚོད་ལ་ཤོག་ཨས།",eng:"Are you telling me to come on time?",type:"You mean? (ཨས་)"},{tib:"བོད་སྐད་སྦྱང་ག་ཡོང་བ་ཡིན་ཨས།",eng:"Do you mean to say that you came to learn Tibetan?",type:"You mean? (ཨས་)"},{tib:"སང་ཉིན་ཡོང་ཡག་ཡིན་ཨས།",eng:"Do you mean to say that you are going to come tomorrow?",type:"You mean? (ཨས་)"},{tib:"སྡུག་བསྔལ་གྱི་རྒྱུ་ཉོན་མོངས་རེད་ད།",eng:"I am letting you know that negative emotions are the cause of suffering.",type:"Letting you know (ད)"},{tib:"སྨན་པ་སྨན་ཁང་ལ་ཡོད་རེད་ད།",eng:"I am letting you know that the doctor is in the hospital.",type:"Letting you know (ད)"},{tib:"རྡོ་རྗེ་གླིང་ལ་དགུན་ཁ་གྲང་སའི་ཡོད་རེད་ད།",eng:"I am letting you know that it is quite cold in winter in Darjeeling.",type:"Letting you know (ད)"},{tib:"དུས་ཚོད་འཕྲོ་བརླག་གཏང་རྒྱུ་ཡོད་མ་རེད་ད།",eng:"I am letting you know that one shouldn’t waste time.",type:"Letting you know (ད)"},{tib:"སྐད་སྦྱང་ཡག་ལ་བཟོད་པ་དང་བརྩོན་འགྲུས་དོ་སྣང་ཡིན་ཅིག་མིན་ཅིག་དགོས་རེད་པ།",eng:"One has to have patience, diligence and interest in order to learn a language, right?",type:"Confirmation tag (པ)"},{tib:"ཁོང་ཚོས་ཁྱེད་རང་ལ་དེའི་སྐོར་ལ་ལབ་མ་སོང་ང།",eng:"They didn’t tell you about it, right?",type:"Confirmation tag (ང)"},{tib:"དབྱར་ཀ་ལས་དགུན་ཁ་གྲང་ང་འདུག་ག།",eng:"Winter is colder than summer, right?",type:"Confirmation tag (ག)"},{tib:"ངས་དྲན་པ་ལ་གྲོང་གསེབ་དེ་ལ་སློབ་གྲྭ་ཡོད་མ་རེད།",eng:"As far as I remember, there is no school in that village.",type:"As far as I know"},{tib:"ངས་ཧ་གོ་ཡག་ལ་དགོན་པ་དེ་ལ་གྲྭ་པ་གསུམ་བརྒྱ་མིན་ཙམ་ཡོད་རེད།",eng:"From what I know, there are a little less than three hundred monks at the monastery.",type:"As far as I know"},{tib:"ངས་མཐོང་པ་ལ་རྡོ་རྗེ་གླིང་ལ་དགུན་ཁ་གྲང་སའི་འདུག།",eng:"As far as I have seen, it is quite cold in winter in Darjeeling.",type:"As far as I know"},{tib:"ངས་གོ་ཡག་ལ་གཞུང་གི་སློབ་གྲ་ལས་སྒེར་གྱི་སློབ་གྲྭ་ཡག་ག་ཡོད་རེད།",eng:"From what I hear, private schools are better than public schools.",type:"As far as I know"},{tib:"སོ་སོ་ལ་རག་ལས་ཀྱི་ཡོད་རེད།",eng:"It depends on oneself.",type:"Depends On/Whether"},{tib:"ཁྱེད་རང་གི་ཀུན་སློང་ལ་རག་ལས་ཀྱི་ཡོད་རེད།",eng:"It depends on your motivation.",type:"Depends On/Whether"},{tib:"རྒྱུ་རྐྱེན་མང་པོ་ལ་རག་ལས་ཀྱི་ཡོད་རེད།",eng:"It depends on many causes and conditions.",type:"Depends On/Whether"},{tib:"ཐུབ་མ་ཐུབ་རྒྱུ་རྐྱེན་མང་པོ་ལ་རག་ལས་ཀྱི་ཡོད་རེད།",eng:"Whether one will succeed or not depends on many causes and conditions.",type:"Depends On/Whether"},{tib:"ང་བལ་ཡུལ་ལ་འགྲོ་མ་འགྲོ་གནས་ཚུལ་ལ་རག་ལས་ཀྱི་ཡོད་རེད།",eng:"Whether I go to Nepal or not depends on the situation there.",type:"Depends On/Whether"},{tib:"ཐུབ་མ་ཐུབ་དོ་སྣང་ཡོད་མེད་ལ་རག་ལས་ཀྱི་ཡོད་རེད།",eng:"Whether you succeed depends on whether you have interest in it or not.",type:"Depends On/Whether"}],xT=[{tib:"གང་ཐུབ་ཐུབ་བྱས་པ་ཡིན།",eng:"I did my best.",type:"Do one's best"},{tib:"གང་ཡོང་ཅི་ཡོང་བྱེད་དགོས་རེད།",eng:"You have to do to the best of your ability.",type:"Do one's best"},{tib:"གང་ཐུབ་ཅི་ཐུབ་གནང་རོགས་གནང།",eng:"Please do your best.",type:"Do one's best"},{tib:"གང་ཐུབ་ཐུབ་བྱེད་ཡག་ཡིན།",eng:"I am going to do my best.",type:"Do one's best"},{tib:"ཁོང་ཚོས་ཁོང་ཚོ་ལ་གང་ཐུབ་ཅི་ཐུབ་རོགས་པ་གནང་ཤག།",eng:"They have done their best to help them.",type:"Do one's best"},{tib:"ཡོད་གུ་རྩལ་སྦྲུག་བྱས་པ་ཡིན།",eng:"I left no stone unturned.",type:"Leave no stone unturned"},{tib:"ཁོང་ཚོས་རྒྱལ་ཁབ་ཡར་རྒྱས་གཏང་ཡག་ལ་ཐབས་ཤེས་ཡོད་གུ་རྩལ་སྦྲུག་བྱས་ཤག",eng:"They have left no stone unturned to develop the country.",type:"Leave no stone unturned"},{tib:"བཀའ་འདྲི་གནང་རྐྱང་གནང་རོགས་གནང།",eng:"Please feel free to ask questions.",type:"Feel free to"},{tib:"བཀའ་འདྲི་ཞུ་རྐྱང་གནས་དགོས་རེད།",eng:"You should feel free to ask questions.",type:"Feel free to"},{tib:"ངའི་ཆང་འཐུང་འདོད་ཡོད་ན་འཐུང་རྐྱང་གནང་ན་འགྲིགས་ཀྱི་རེད།",eng:"You can feel free to drink my beer if you want to.",type:"Feel free to"},{tib:"ངའི་གཙོ་འཛིན་གྱིས་ལས་འཆར་དེ་བྱེད་རྐྱང་བྱེད་གསུངས་བྱུང།",eng:"My boss told me to go ahead with the project.",type:"Feel free to"},{tib:"ཁོང་ཚོ་ངའི་ཁང་མིག་ལ་ཡོང་རྐྱང་བྱེད་ཀྱི་ཡོད་རེད།",eng:"They come to my room at will.",type:"Feel free to"},{tib:"ཁོང་གིས་གསང་བ་བཤད་རྐྱང་བྱེད་ཀྱི་ཡོད་རེད།",eng:"He tells his secret without giving second thought.",type:"Feel free to"},{tib:"ཨམ་ཆི་ལ་གོ་བསྡུར་བྱས་པའི་སྔོན་ལ་སྨན་བཟས་ནས་ག་རེ་བྱས་ག།",eng:"Why on earth did you take medicine before consulting a doctor?",type:"Why on earth"},{tib:"ང་ལ་གོ་སྡུར་མ་བྱས་སྔོན་ལ་ཐག་བཅད་ནས་ག་རེ་བྱས་ག།",eng:"Why on earth did you decide before consulting me?",type:"Why on earth"},{tib:"ང་ལ་སྔོན་ལ་མ་ལབ་ནས་ག་རེ་བྱས་ག།",eng:"Why on earth didn’t you tell me before?",type:"Why on earth"},{tib:"བཀའ་ཁྲོལ་མ་ཞུས་ནས་ཡོང་ནས་ག་རེ་བྱས་ག།",eng:"Why on earth did you come without asking permission?",type:"Why on earth"},{tib:"དངུལ་མེད་པ་ལ་ཚོང་ག་པར་རྒྱབ་ཐུབ་ཀྱི་རེད།",eng:"There is no way one can do business without money.",type:"Out of the question"},{tib:"ཁོ་ཨ་རག་ག་པར་འཐུང་གི་རེད།",eng:"Him drinking alcohol is out of the question.",type:"Out of the question"},{tib:"ཚང་མ་ཚར་ཚར་ནས་འགྱོད་པ་སྐྱེས་ནས་ཆོ་ཡོད་མ་རེད།",eng:"There is no point in regretting after everything is over.",type:"No point in"},{tib:"ཆོ་ལ།",eng:"What a nonsense.",type:"What a nonsense"},{tib:"དགོན་པ་དེ་ལ་འགྲོ་འོས་པ་ཡོད་རེད།",eng:"It is worth going to the monastery.",type:"Worth doing"},{tib:"དེབ་དེ་ཉོ་འོས་པ་ཡོད་མ་རེད།",eng:"It is not worth buying the book.",type:"Worth doing"},{tib:"གྲོང་གསེབ་དེ་ལ་འགྲོ་འོས་པ་ཡོད་རེད་པས།",eng:"Is it worth going to the village?",type:"Worth doing"},{tib:"བཀའ་ཁྲོལ་མེད་པ་ལ་ཡོང་ཆོག་གི་ཡོད་མ་རེད།",eng:"Without permission one is not allowed to come.",type:"Without doing"},{tib:"དངུལ་མེད་པ་ལ་ཚོང་རྒྱབ་ཐུབ་ཀྱི་མ་རེད།",eng:"One cannot do business without money.",type:"Without doing"},{tib:"བཟོད་པ་མེད་པ་ལ་སྐད་སྦྱང་ཡག་དཀའ་ལས་ཁག་པོ་ཡོད་རེད།",eng:"It is difficult to learn a language without patience.",type:"Without doing"},{tib:"ཆུ་མེད་པ་ལ་གསོན་པོ་སྡད་ཐུབ་ཀྱི་མ་རེད།",eng:"One can’t survive without water.",type:"Without doing"},{tib:"ཁོང་གང་ཡང་མ་གསུངས་ནས་ཕེབས་སོང།",eng:"He went without saying anything.",type:"Without doing"},{tib:"བཀའ་ཁྲོལ་མ་ཞུས་ནས་ཕེབས་རྒྱུ་ཡོད་མ་རེད།",eng:"One shouldn’t go there without asking permission.",type:"Without doing"},{tib:"ཁོང་ཚོ་ལ་གོ་བསྡུར་མ་བྱས་ནས་ཐག་གཅོད་བྱེད་འདོད་མེད།",eng:"I don’t want to decide without consulting them.",type:"Without doing"},{tib:"དུ་བ་ཡོད་ན་མེ་ཡོད་པ་ཁྱབ་ཀྱི་ཡོད་རེད།",eng:"If there is smoke, it entails that there is fire.",type:"Entails"},{tib:"དཀོན་པོ་ཡོད་ན་གོང་ཆེན་པོ་ཡོད་པ་ཁྱབ་ཀྱི་ཡོད་རེད།",eng:"If it is scarce, it is needless to say that it is expensive.",type:"Entails"},{tib:"དུ་བ་མེད་ན་མེ་མེད་པ་ཁྱབ་ཀྱི་ཡོད་མ་རེད།",eng:"If there is no smoke, it doesn’t necessarily mean there isn’t fire.",type:"Merely because"},{tib:"ཕྱུག་པོ་ཡིན་ན་གཏོང་ཕ
